services:
  jenkins:
    build: .
    container_name: jenkins-especialidad
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      ADMIN_USER: ${JENKINS_ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?set JENKINS_ADMIN_PASSWORD in jenkins/.env}
    volumes:
      - jenkins_home:/var/jenkins_home
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/login"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 5

volumes:
  jenkins_home:
