         escritorio y no aplica las reglas @media de la hoja de estilos. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Gestión de ventas, clientes y productos de Mi Tienda" />
    <meta name="theme-color" content="#1d4ed8" />
    <!-- Aplicacion instalable (PWA): manifiesto e icono para la pantalla de inicio. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Mi Tienda</title>
  </head>
  <body>
    <noscript>Mi Tienda necesita JavaScript para funcionar.</noscript>
    <div id="root"></div>
  </body>
</html>
